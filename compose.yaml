services:
  vtmf-settings:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file: settings.env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    volumes:
      - .VTMF.Settings/appsettings.json:/app/appsettings.json
      - .VTMF.Settings/appsettings.Development.json:/app/appsettings.Development.json
      - data-protection-keys:/app/keys

  vtmf-settings-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    ports:
      - "8081:8080"
    env_file: settings.env

volumes:
  data-protection-keys: