services:
  vtmf-settings:
    image: vtmf/settingsmanager:v2.16
    ports:
      - "8080:8080"
    env_file: settings.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    volumes:
      - data-protection-keys:/app/keys
      - ${SQL_SCRIPTS_PATH}:/app/sql-scripts

  vtmf-settings-mcp:
    image: vtmf/settingsmanager-mcp:v2.16
    ports:
      - "127.0.0.1:8081:8080"
    env_file: settings.env

volumes:
  data-protection-keys: